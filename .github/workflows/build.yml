name: Publish new package to NPM registry

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  # ============================================
  # Publish
  # ============================================
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - run: npm publish --access public


  # ============================================
  # Release creation
  # ============================================
  release:
    name: Create release
    needs: [ publish ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      IMAGE_TAG: ${{ needs.variables.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - id: create_release
        name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ env.IMAGE_TAG }}
          body: This is an automated release, wait for the change log to be updated
          draft: false
          prerelease: false
